defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}

# Square: the paper's Table 4 settings (discount 0.999, initial rollout 32k env
# steps, td100 base policy sampled with 8 DDIM steps) plus the same study keys
# as dsrl_can.yaml (exp_id/resume, env-step budget and schedules, variant,
# offline_mix, diagnostics), so train_dsrl.py runs it unchanged.
name: robomimic_square_dsrl_${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
logdir: ${log_dir}/robomimic-dsrl/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ./dppo/log/robomimic-pretrain/square/square_pre_diffusion_mlp_ta4_td100_ddim-100steps/2025-04-11_19-13-26_44/checkpoint/state_3000.pt
offline_data_path: ./dppo/log/robomimic/square_traj_data/train_offline.npz
normalization_path: ./dppo/log/robomimic/${env_name}/normalization.npz
dppo_path: ./dppo

algorithm: dsrl_na
variant: baseline # baseline | warmup | iql (warmup/iql need a pretrain file; none exists for Square yet)
pretrain_path: ''

seed: 1
device: cuda:0
use_wandb: False # metrics always go to train_log.csv / eval_log.csv in ${logdir}
env_name: square
log_dir: ./logs
obs_dim: 23
action_dim: 7
cond_steps: 1
act_steps: 4
load_offline_data: False
deterministic_eval: False

exp_id: ''
resume: True
ckpt_dir: ''
ckpt_every_env_steps: 25000
save_replay_buffer: True

# Same evaluation schedule as Can, in env steps: the dip is expected about
# 10k training steps after the 32k rollout, i.e. near 42k, so the early phase
# must stay at 5k resolution. One Square episode is 400 env steps.
eval_schedule:
  every_env_early: 5000
  early_until_env: 100000
  num_evals_early: 100
  every_env: 25000

num_evals: 200
eval_interval: 4000 # only used if eval_schedule is removed
save_model_interval: 1000000 # only used if ckpt_every_env_steps is 0

env:
  n_envs:  4
  n_eval_envs: 25
  name: ${env_name}
  max_episode_steps: 400
  reset_at_iteration: False
  save_video: False
  best_reward_threshold_for_success: 1
  reward_offset: 1
  wrappers:
    robomimic_lowdim:
      normalization_path: ${normalization_path}
      low_dim_keys: ['robot0_eef_pos',
                    'robot0_eef_quat',
                    'robot0_gripper_qpos',
                    'object']
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True

wandb:
  project: dsrl
  run: ${now:%H-%M-%S}_${name}
  group: robomimic-square

train:
  total_env_steps: 300000 # budget in env steps, initial rollout (32,016) included
  # 200000 -> 50000 slots; a 300k run needs 2001 + 300000/16 = 20,751.
  buffer_size: 200000
  offline_mix_ratio: -1
  tau: 0.005 # Target update rate
  actor_lr: 3e-4
  batch_size: 256
  train_freq: 1 # Update model after this many environment steps
  utd: 20 # Number of gradient steps to take per update
  noise_critic_grad_steps: 10 # Number of gradient steps to take per update when fitting noise critic
  use_layer_norm: True
  layer_size: 2048 # Layer size for actor and critic
  num_layers: 3 # Number of layers for actor and critic
  discount: 0.999
  ent_coef: -1
  target_ent: 0.0
  # Learning rate of the alpha optimizer alone; -1 shares actor_lr (upstream).
  # log(alpha) falls about ent_coef_lr per gradient step, so halving it
  # doubles the time until alpha < 0.1 (the point the dip is tied to).
  ent_coef_lr: -1
  # Critic-target levers for the Q-scale hypothesis (both 1.0 = upstream).
  # reward_scale multiplies r in the target only (logged returns are not
  # scaled); critic_entropy_scale multiplies the alpha * log pi bonus in the
  # target, 0 being a hard backup.
  reward_scale: 1.0
  critic_entropy_scale: 1.0
  init_rollout_steps: 2001 # 2001 x 4 envs x 4 chunk = 32,016 env steps, the paper's "initial steps 32000"
  action_magnitude: 1.5 # Maximum action magnitude in noise action space
  n_critics: 2 # Number of critic Q networks
  critic_backup_combine_type: min

pretrain:
  method: iql # iql | warmup
  steps: 50000
  distill_steps: 25000
  actor_steps: 0
  expectile: 0.7
  batch_size: 256
  log_every: 500
  out_path: ''
  load_ent_coef: False
  load_actor: True

# Gate (o2o_utils.GateController): hold one lever until the critic looks
# trustworthy, then release it for good. signal=ratio opens when the actor's
# entropy-gradient / Q-gradient ratio (train_log ratio_ge_gq) stays below tau
# for K consecutive updates; signal=clock opens after clock_calls updates and
# is the control. actuator=hard_backup drops the entropy bonus from the critic
# target while closed; actuator=alpha_hold pins alpha at alpha_hi while closed.
gate:
  enabled: false
  signal: ratio # ratio | clock
  actuator: hard_backup # hard_backup | alpha_hold
  tau: 1.0
  K: 50
  clock_calls: 0
  alpha_hi: 0.3

offline_mix:
  mode: none # none | prefill | fixed | linear (all but none need offline_data_path, which Square does not have yet)
  p0: 0.5
  p1: 0.1
  until_env: 100000

model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: 0
  predict_epsilon: True
  denoised_clip_value: 1.0
  randn_clip_value: 3
  network_path: ${base_policy_path}
  network:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 32
    mlp_dims: [1024, 1024, 1024]
    cond_mlp_dims: [512, 64]
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${act_steps}
    action_dim: ${action_dim}
  horizon_steps: ${act_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: 100
  device: ${device}
  use_ddim: True
  ddim_steps: 8
  controllable_noise: True
