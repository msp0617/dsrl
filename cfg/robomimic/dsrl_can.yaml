defaults:
  - _self_
hydra:
  run:  
    dir: ${logdir}

name: robomimic_can_dsrl_${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
logdir: ${log_dir}/robomimic-dsrl/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ./dppo/log/robomimic-pretrain/can/can_pre_diffusion_mlp_ta4_td20/2024-06-28_13-29-54/checkpoint/state_5000.pt
offline_data_path: ./dppo/log/robomimic/can_test/train_offline.npz
dppo_path: ./dppo
normalization_path: ./dppo/log/robomimic/${env_name}/normalization.npz

algorithm: dsrl_na # options are: dsrl_na, dsrl_sac
# Offline-to-online study. The variant only changes where the initial critic
# weights come from; warmup and iql load a file made by offline_pretrain.py.
variant: baseline # baseline | warmup | iql
pretrain_path: '' # required for warmup and iql

seed: 1
device: cuda:0
use_wandb: False # metrics always go to train_log.csv / eval_log.csv in ${logdir}
env_name: can
log_dir: ./logs 
obs_dim: 23
action_dim: 7
cond_steps: 1
act_steps: 4 # action chunk size of base policy
load_offline_data: False # if true, load offline demonstration data into replay buffer
deterministic_eval: False # if true, run eval with both deterministic actions, as well as stochastic

# Set exp_id to a stable name to make a run resumable: the run then writes to
# ${log_dir}/${exp_id} instead of a fresh timestamped folder every session.
exp_id: ''
resume: True
ckpt_dir: '' # defaults to ${logdir}/checkpoint
# Rolling checkpoint period in original-env steps. One checkpoint is about
# 640MB (580MB of weights and optimizer state, 60MB of replay buffer) and two
# slots are kept, so a run holds ~1.3GB. Delete a finished run's checkpoint
# directory once its CSVs are safe.
ckpt_every_env_steps: 25000
save_replay_buffer: True # an off-policy run cannot be resumed without it

# Evaluation schedule in original-environment steps. Dense over the early phase,
# where the initial dip lives; sparse afterwards.
# One evaluation runs num_evals episodes of 300 env steps each, so evaluating
# often is not free. The early phase trades episodes for resolution.
eval_schedule:
  every_env_early: 5000
  early_until_env: 100000
  num_evals_early: 100
  every_env: 25000

num_evals: 200
eval_interval: 3000 # only used if eval_schedule is removed (counts callback calls)
save_model_interval: 10000 # only used if ckpt_every_env_steps is 0

env:
  n_envs:  4
  n_eval_envs: 25
  name: ${env_name}
  max_episode_steps: 300
  reset_at_iteration: False
  save_video: False
  best_reward_threshold_for_success: 1 
  reward_offset: 1
  wrappers:
    robomimic_lowdim:
      normalization_path: ${normalization_path}
      low_dim_keys: ['robot0_eef_pos',
                    'robot0_eef_quat',
                    'robot0_gripper_qpos',
                    'object'] # same order of preprocessed observations
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True

wandb:
  project: dsrl
  run: ${now:%H-%M-%S}_${name}
  group: robomimic-can

train:
  total_env_steps: 300000 # budget in original-env steps, initial rollout included
  # Buffer slots are buffer_size/n_envs and one slot holds one action chunk per env.
  # Needs init_rollout_steps + offline_adds + total_env_steps/(act_steps*n_envs) slots.
  # 200000 -> 50000 slots, about 20000 needed for a 300k-step run, ~60MB per checkpoint.
  buffer_size: 200000
  offline_mix_ratio: -1 # >0 fixes the offline share of each sampled batch
  tau: 0.005 # Target update rate
  actor_lr: 3e-4
  batch_size: 256
  train_freq: 1 # Update model after this many environment steps
  utd: 20 # Number of gradient steps to take per update
  noise_critic_grad_steps: 10 # Number of gradient steps to take per update when fitting noise critic 
  use_layer_norm: True
  layer_size: 2048 # Layer size for actor and critic
  num_layers: 3 # Number of layers for actor and critic
  discount: 0.99
  ent_coef: -1
  target_ent: 0.0
  # Learning rate of the alpha optimizer alone; -1 shares actor_lr (upstream).
  # log(alpha) falls about ent_coef_lr per gradient step, so halving it
  # doubles the time until alpha < 0.1 (the point the dip is tied to).
  ent_coef_lr: -1
  init_rollout_steps: 1501 # Number of rollout steps of standard diffusion policy to collect for replay buffer before training starts
  action_magnitude: 1.5 # Maximum action magnitude in noise action space
  n_critics: 2 # Number of critic Q networks
  critic_backup_combine_type: min

# offline_pretrain.py (no simulator needed). `steps` is gradient steps on the
# offline data; iql then distills Q_A into Q_W for `distill_steps`.
# warmup distills steps/utd*noise_critic_grad_steps times as a side effect of
# DSRL's own update, so distill_steps is set to match it (50000/20*10).
pretrain:
  method: iql # iql | warmup
  steps: 50000
  distill_steps: 25000
  actor_steps: 0 # iql only; >0 also moves pi_W toward argmax Q_W before going online
  expectile: 0.7
  batch_size: 256
  log_every: 500
  out_path: '' # defaults to ${log_dir}/pretrain/${pretrain.method}_${env_name}_s${seed}.pt
  # warmup also anneals the entropy coefficient offline. Loading it would give
  # warmup a head start that has nothing to do with the critic, so by default
  # every variant goes online with the same initial alpha.
  load_ent_coef: False
  # warmup trains an actor alongside its critics. With load_actor=False only
  # the critics are loaded and the actor starts random, as in iql, so the two
  # variants then differ in nothing but how the critic was made.
  load_actor: True

# Offline replay mix: how much of each training batch comes from the
# demonstrations. none reproduces the runs made before this key existed.
#   prefill  the upstream load_offline_data path: D_off goes into the online
#            buffer once and its share then decays by itself (about 0.9 at the
#            start of training to 0.4 at 300k on Can, since the buffer never
#            wraps). train_log.csv records that share as offline_p.
#   fixed    every batch has p0 of its rows from D_off.
#   linear   p(t) = p0 + (p1 - p0) * min(t / until_env, 1), t counted in env
#            steps from the start of training (after the initial rollout).
# fixed and linear keep D_off in their own buffer; load_offline_data stays False.
offline_mix:
  mode: none # none | prefill | fixed | linear
  p0: 0.5
  p1: 0.1
  until_env: 100000

model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: 0
  predict_epsilon: True
  denoised_clip_value: 1.0
  randn_clip_value: 3
  network_path: ${base_policy_path}
  network:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${act_steps}
    action_dim: ${action_dim}
  horizon_steps: ${act_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: 20
  device: ${device}
  use_ddim: True
  ddim_steps: 8
  controllable_noise: True